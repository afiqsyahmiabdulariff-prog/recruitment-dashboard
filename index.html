<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recruitment Dashboard - iCar MY</title>
<link rel="icon" href="https://raw.githubusercontent.com/afqrff/P-C-Portal/98f5713750564c217277ba6ef36239d61e14768f/blue-recruitment-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!--
  Recruitment Dashboard - iCar MY
  ================================
  A read-only dashboard for people outside iCar Asia.
  This page holds NO data. After "Sign in with Google" it reads the shared reports Google Sheet
  ("Recruitment Reports - iCar MY (shared)", made and updated every morning by the Recruitment Tracker)
  with the viewer's own Google access. Only people that sheet is shared with can see the numbers.

  The two settings below are the only things to fill in (see SETUP.md).
-->
<script>
  // 1. The Google sign-in key ("OAuth client ID") from Google Cloud, ends with .apps.googleusercontent.com
  const CLIENT_ID = 'PASTE-YOUR-CLIENT-ID.apps.googleusercontent.com';
  // 2. The shared reports sheet: the long code in its link, between /d/ and /edit
  const SHEET_ID = 'PASTE-THE-SHARED-SHEET-ID';
</script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root {
    --navy: #13284f; --navy-2: #1c3a6e; --yellow: #f2c94c; --bg: #f4f5f7; --surface: #ffffff; --line: #e4e7ec;
    --ink: #1d2433; --muted: #667085; --blue: #2f6fdb; --green: #12935c; --amber: #d9a400; --red: #d9363e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.5 'Inter', Arial, sans-serif; }
  button { font: inherit; cursor: pointer; }
  .top { background: var(--surface); border-bottom: 1px solid var(--line); }
  .top-in { max-width: 1180px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
  .top img { width: 34px; height: 34px; border-radius: 8px; object-fit: contain; }
  .top h1 { font-size: 17px; margin: 0; line-height: 1.2; }
  .top .sub { color: var(--muted); font-size: 12.5px; }
  .top .grow { flex: 1; min-width: 0; }
  .btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 7px 14px; font-weight: 600; }
  .btn:hover { background: #f8f9fb; }
  .btn.primary { background: var(--navy); border-color: var(--navy); color: #fff; }
  main { max-width: 1180px; margin: 0 auto; padding: 18px 16px 40px; }
  .welcome { display: flex; align-items: center; gap: 16px; background: linear-gradient(100deg, var(--navy) 0%, var(--navy-2) 100%); color: #fff;
    border-radius: 12px; padding: 18px 22px; margin-bottom: 16px; flex-wrap: wrap; }
  .welcome .w-ic { flex: none; width: 44px; height: 44px; border-radius: 10px; background: var(--yellow); color: var(--navy); display: grid; place-items: center; }
  .welcome .w-txt { flex: 1; min-width: 220px; }
  .welcome .w-txt b { display: block; font-size: 17px; }
  .welcome .w-txt span { font-size: 13px; color: #c9d4ea; }
  .w-stats { display: flex; flex-wrap: wrap; }
  .w-st { border-left: 1px solid rgba(255,255,255,.18); padding: 2px 18px; min-width: 110px; }
  .w-st .l { font-size: 11.5px; color: #c9d4ea; }
  .w-st .n { font-size: 22px; font-weight: 800; line-height: 1.3; }
  .w-st .s { font-size: 11px; color: var(--yellow); font-weight: 600; }
  .sec { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 22px 0 10px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .card .l { color: var(--muted); font-size: 12.5px; font-weight: 600; }
  .card .n { font-size: 28px; font-weight: 800; line-height: 1.25; margin-top: 4px; }
  .card .s { color: var(--muted); font-size: 12px; }
  .card.accent { border-left: 4px solid var(--yellow); }
  .grid2 { display: grid; grid-template-columns: 1fr 1.6fr; gap: 14px; }
  @media (max-width: 860px) { .grid2 { grid-template-columns: 1fr; } }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
  .panel h2 { font-size: 15px; margin: 0 0 2px; }
  .panel .hint { color: var(--muted); font-size: 12.5px; margin-bottom: 12px; }
  .stage { display: grid; grid-template-columns: 130px 1fr 34px; align-items: center; gap: 10px; margin: 8px 0; font-size: 13px; }
  .stage .bar { height: 12px; background: #eef1f6; border-radius: 6px; overflow: hidden; }
  .stage .bar i { display: block; height: 100%; background: var(--blue); border-radius: 6px; min-width: 2px; }
  .stage b { text-align: right; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin: 4px 0 6px; }
  .legend span::before { content: ''; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; background: var(--c); }
  .legend .line::before { height: 3px; vertical-align: 3px; border-radius: 2px; }
  .chart svg { width: 100%; height: auto; display: block; }
  .tbl-wrap { overflow-x: auto; margin-top: 12px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; background: #f8f9fb; }
  tr.now td { background: #fffbea; font-weight: 600; }
  .center { max-width: 460px; margin: 70px auto; text-align: center; }
  .center .panel { padding: 30px 26px; }
  .center img { width: 64px; height: 64px; object-fit: contain; }
  .center h2 { margin: 12px 0 6px; font-size: 20px; }
  .center p { color: var(--muted); margin: 0 0 18px; }
  .alert { border-radius: 10px; padding: 12px 14px; margin: 14px 0; text-align: left; font-size: 13.5px; }
  .alert.err { background: #fdecec; color: #8a1c22; border: 1px solid #f5c2c5; }
  .alert.info { background: #eef4ff; color: #1d3f7a; border: 1px solid #cddcfb; }
  .foot { color: var(--muted); font-size: 12px; text-align: center; margin-top: 28px; }
  .demo-tag { background: var(--yellow); color: var(--navy); font-size: 11px; font-weight: 700; border-radius: 999px; padding: 2px 8px; margin-left: 6px; vertical-align: 2px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <img src="https://raw.githubusercontent.com/afqrff/P-C-Portal/98f5713750564c217277ba6ef36239d61e14768f/blue-recruitment-logo.png" alt="" onerror="this.style.visibility='hidden'">
  <div class="grow"><h1>Recruitment Dashboard <span id="demoTag" class="demo-tag" hidden>Sample data</span></h1>
    <div class="sub">iCar Asia Malaysia · <span id="who">read-only view</span></div></div>
  <button class="btn" id="refreshBtn" hidden>Refresh</button>
  <button class="btn" id="signOutBtn" hidden>Sign out</button>
</div></header>

<main id="app">
  <div class="center"><div class="panel">
    <img src="https://raw.githubusercontent.com/afqrff/P-C-Portal/98f5713750564c217277ba6ef36239d61e14768f/blue-recruitment-logo.png" alt="" onerror="this.style.visibility='hidden'">
    <h2>Recruitment Dashboard</h2>
    <p>Sign in with the Google account the report was shared with.</p>
    <div id="msg"></div>
    <button class="btn primary" id="signInBtn">Sign in with Google</button>
  </div></div>
</main>

<script>
(function () {
  'use strict';
  const $ = function (id) { return document.getElementById(id); };
  const esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); };
  const SCOPE = 'https://www.googleapis.com/auth/spreadsheets.readonly';
  const DEMO = /[?&]demo=1/.test(location.search);   // ?demo=1 shows sample numbers, no sign-in (to preview the look)
  let token = null, tokenClient = null, email = '';

  // ---------- sign-in (Google Identity Services: a short-lived read-only token, kept only in this tab)
  function msg(html, kind) { const m = $('msg'); if (m) m.innerHTML = html ? '<div class="alert ' + (kind || 'err') + '">' + html + '</div>' : ''; }
  function setupNeeded() { return /PASTE-/.test(CLIENT_ID) || /PASTE-/.test(SHEET_ID); }

  function initAuth() {
    if (!window.google || !google.accounts || !google.accounts.oauth2) { setTimeout(initAuth, 150); return; }
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID, scope: SCOPE + ' email',
      callback: function (r) {
        if (r.error) { msg('Sign-in was not completed (' + esc(r.error) + '). Please try again.'); return; }
        token = r.access_token;
        try { sessionStorage.setItem('rdTok', JSON.stringify({ t: token, until: Date.now() + (Number(r.expires_in) || 3600) * 1000 - 60000 })); } catch (e) { /* private window */ }
        loadData();
      },
    });
  }
  function signIn() {
    if (setupNeeded()) { msg('This page is not set up yet: the sign-in key and the sheet ID still need to be filled in (see SETUP.md).'); return; }
    if (!tokenClient) { msg('Google sign-in is still loading. Try again in a moment.', 'info'); return; }
    tokenClient.requestAccessToken({ prompt: '' });
  }
  function signOut() {
    try { if (token && google.accounts.oauth2.revoke) google.accounts.oauth2.revoke(token, function () {}); } catch (e) { /* ignore */ }
    token = null; try { sessionStorage.removeItem('rdTok'); } catch (e) { /* ignore */ }
    location.reload();
  }

  // ---------- data: the two tabs of the shared reports sheet
  function api(path) {
    return fetch('https://sheets.googleapis.com/v4/spreadsheets/' + encodeURIComponent(SHEET_ID) + path, {
      headers: { Authorization: 'Bearer ' + token },
    }).then(function (r) {
      if (r.ok) return r.json();
      return r.json().catch(function () { return {}; }).then(function (b) {
        const e = new Error((b.error && b.error.message) || ('Error ' + r.status)); e.status = r.status; throw e;
      });
    });
  }
  function loadData() {
    $('app').innerHTML = '<div class="center"><div class="panel"><p>Loading the latest numbers…</p></div></div>';
    const ranges = ['Summary!A1:B60', "'Opened & Closed'!A1:G20"].map(function (r) { return 'ranges=' + encodeURIComponent(r); }).join('&');
    Promise.all([
      api('/values:batchGet?' + ranges + '&valueRenderOption=FORMATTED_VALUE'),
      fetch('https://www.googleapis.com/oauth2/v3/userinfo', { headers: { Authorization: 'Bearer ' + token } }).then(function (r) { return r.ok ? r.json() : {}; }).catch(function () { return {}; }),
    ]).then(function (res) {
      email = res[1].email || '';
      const vr = res[0].valueRanges || [];
      render(parse(vr[0] && vr[0].values, vr[1] && vr[1].values));
    }).catch(function (e) {
      const why = e.status === 403 ? 'Your Google account' + (email ? ' (' + esc(email) + ')' : '') + ' does not have access to this report. Ask iCar Asia People &amp; Culture to share it with you.' :
        e.status === 404 ? 'The report could not be found. The sheet ID in this page may be wrong.' :
        e.status === 401 ? 'Your sign-in has expired. Please sign in again.' : 'Could not load the report: ' + esc(e.message);
      if (e.status === 401) { try { sessionStorage.removeItem('rdTok'); } catch (x) { /* ignore */ } }
      showSignIn(why);
    });
  }

  // Summary: row 1 title, row 2 "Updated …", row 4 header, rows 5+ Measure | Number (stages are indented)
  // Opened & Closed: same layout, columns Month | Position Opened | New Position | Filled | On Hold | Total Closed | Month Balance
  function parse(sum, oc) {
    sum = sum || []; oc = oc || [];
    const num = function (v) { const n = Number(String(v == null ? '' : v).replace(/,/g, '')); return isNaN(n) ? 0 : n; };
    const out = { title: (sum[0] || [])[0] || '', updated: String((sum[1] || [])[0] || '').replace(/ · from the.*$/, ''), measures: {}, stages: [], months: [] };
    sum.slice(4).forEach(function (r) {
      const name = String(r[0] || ''); if (!name.trim()) return;
      if (/^\s/.test(name)) out.stages.push({ name: name.trim(), n: num(r[1]) }); else out.measures[name.trim()] = num(r[1]);
    });
    out.ocTitle = (oc[0] || [])[0] || '';
    oc.slice(4).forEach(function (r) {
      if (!String(r[0] || '').trim() || /^Nothing/.test(r[0])) return;
      out.months.push({ label: String(r[0]), opened: num(r[1]), fresh: num(r[2]), filled: num(r[3]), hold: num(r[4]), closed: num(r[5]), balance: num(r[6]) });
    });
    return out;
  }

  // ---------- page
  function m(d, k) { return d.measures[k] != null ? d.measures[k] : 0; }
  function card(label, n, sub, accent) {
    return '<div class="card' + (accent ? ' accent' : '') + '"><div class="l">' + esc(label) + '</div><div class="n">' + esc(n) + '</div>' + (sub ? '<div class="s">' + esc(sub) + '</div>' : '') + '</div>';
  }
  function render(d) {
    $('signOutBtn').hidden = DEMO; $('refreshBtn').hidden = DEMO;
    $('who').textContent = DEMO ? 'sample data, not real numbers' : (email ? 'signed in as ' + email : 'read-only view');
    const asOf = (d.title.match(/as of ([0-9-]+)/) || [])[1] || '';
    let h = '<div class="welcome"><div class="w-ic"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.2a6.5 6.5 0 0 1 3.5 5.8"/></svg></div>' +
      '<div class="w-txt"><b>Recruitment at a glance</b><span>' + (asOf ? 'As of ' + esc(asOf) + ' · ' : '') + 'updated every morning at 7 am' + (d.updated ? ' · last update ' + esc(d.updated.replace(/^Updated /, '')) : '') + '</span></div>' +
      '<div class="w-stats">' +
        '<div class="w-st"><div class="l">Open positions</div><div class="n">' + m(d, 'Open positions') + '</div><div class="s">hiring now</div></div>' +
        '<div class="w-st"><div class="l">Active candidates</div><div class="n">' + m(d, 'Active candidates') + '</div><div class="s">in the pipeline</div></div>' +
        '<div class="w-st"><div class="l">Upcoming joiners</div><div class="n">' + m(d, 'Upcoming joiners (join date after today)') + '</div><div class="s">starting soon</div></div>' +
      '</div></div>';
    h += '<div class="sec">This month</div><div class="cards">' +
      card('Filled this month', m(d, 'Filled this month'), 'positions closed as filled', true) +
      card('Hired this month', m(d, 'Hired this month (by hire date)'), 'by hire date') +
      card('Joining this month', m(d, 'Joining this month (by join date)'), 'by join date') +
      card('Interviews this month', m(d, 'Interviews this month'), 'scheduled or done') +
      card('On hold', m(d, 'On hold'), 'positions paused') +
      '</div>';
    const maxStage = Math.max.apply(null, [1].concat(d.stages.map(function (s) { return s.n; })));
    h += '<div class="grid2" style="margin-top:14px"><div class="panel"><h2>Candidates by stage</h2><div class="hint">Active candidates today</div>' +
      (d.stages.length ? d.stages.map(function (s) {
        return '<div class="stage"><span>' + esc(s.name) + '</span><div class="bar"><i style="width:' + (s.n / maxStage * 100) + '%"></i></div><b>' + s.n + '</b></div>';
      }).join('') : '<div class="hint">No data.</div>') + '</div>';
    h += '<div class="panel"><h2>Positions opened &amp; closed</h2><div class="hint">' + esc(d.ocTitle.replace(/^Positions Opened & Closed · /, '')) + '</div>' +
      '<div class="legend"><span style="--c:var(--blue)">New positions</span><span style="--c:var(--green)">Closed (filled, on hold, cancelled)</span><span class="line" style="--c:var(--amber)">Still open at month end</span></div>' +
      '<div class="chart">' + ocChart(d.months) + '</div></div></div>';
    h += '<div class="panel" style="margin-top:14px"><h2>Month by month</h2><div class="tbl-wrap"><table><thead><tr>' +
      ['Month', 'Open in month', 'New', 'Filled', 'On hold', 'Total closed', 'Month balance'].map(function (x) { return '<th>' + x + '</th>'; }).join('') +
      '</tr></thead><tbody>' + d.months.map(function (r, i) {
        return '<tr' + (i === d.months.length - 1 ? ' class="now"' : '') + '><td>' + esc(r.label) + '</td><td>' + r.opened + '</td><td>' + r.fresh + '</td><td>' + r.filled +
          '</td><td>' + r.hold + '</td><td>' + r.closed + '</td><td>' + r.balance + '</td></tr>';
      }).join('') + '</tbody></table></div></div>';
    h += '<div class="foot">Read-only · numbers only, no personal details · from the iCar MY Recruitment Tracker</div>';
    $('app').innerHTML = h;
  }

  // grouped bars (new / closed) + a line for the month-end balance; drawn as SVG so it needs no chart library
  function ocChart(rows) {
    if (!rows.length) return '<div class="hint">No months yet.</div>';
    const W = 680, H = 260, L = 34, R = 10, T = 14, B = 34;
    const max = Math.max(1, Math.max.apply(null, rows.map(function (r) { return Math.max(r.fresh, r.closed, r.balance); })));
    const step = Math.max(1, Math.ceil(max / 4)), top = step * 4;
    const x0 = function (i) { return L + (W - L - R) * i / rows.length; }, cw = (W - L - R) / rows.length;
    const y = function (v) { return T + (H - T - B) * (1 - v / top); };
    const bw = Math.min(18, cw / 3);
    let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="New and closed positions per month">';
    for (let v = 0; v <= top; v += step) {
      s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="#e4e7ec"/>' +
        '<text x="' + (L - 6) + '" y="' + (y(v) + 4) + '" font-size="11" text-anchor="end" fill="#667085">' + v + '</text>';
    }
    let line = '';
    rows.forEach(function (r, i) {
      const cx = x0(i) + cw / 2;
      s += '<rect x="' + (cx - bw - 1) + '" y="' + y(r.fresh) + '" width="' + bw + '" height="' + (y(0) - y(r.fresh)) + '" rx="3" fill="#2f6fdb"><title>' + esc(r.label) + ': ' + r.fresh + ' new</title></rect>' +
        '<rect x="' + (cx + 1) + '" y="' + y(r.closed) + '" width="' + bw + '" height="' + (y(0) - y(r.closed)) + '" rx="3" fill="#12935c"><title>' + esc(r.label) + ': ' + r.closed + ' closed</title></rect>' +
        '<text x="' + cx + '" y="' + (H - 12) + '" font-size="11" text-anchor="middle" fill="#667085">' + esc(r.label.split(' ')[0]) + '</text>';
      line += (i ? 'L' : 'M') + cx + ' ' + y(r.balance);
    });
    s += '<path d="' + line + '" fill="none" stroke="#d9a400" stroke-width="2.5"/>';
    rows.forEach(function (r, i) {
      s += '<circle cx="' + (x0(i) + cw / 2) + '" cy="' + y(r.balance) + '" r="4" fill="#fff" stroke="#d9a400" stroke-width="2"><title>' + esc(r.label) + ': ' + r.balance + ' open at month end</title></circle>';
    });
    return s + '</svg>';
  }

  function showSignIn(why) {
    $('signOutBtn').hidden = true; $('refreshBtn').hidden = true;
    $('app').innerHTML = '<div class="center"><div class="panel"><img src="https://raw.githubusercontent.com/afqrff/P-C-Portal/98f5713750564c217277ba6ef36239d61e14768f/blue-recruitment-logo.png" alt="" onerror="this.style.visibility=\'hidden\'">' +
      '<h2>Recruitment Dashboard</h2><p>Sign in with the Google account the report was shared with.</p><div id="msg"></div>' +
      '<button class="btn primary" id="signInBtn">Sign in with Google</button></div></div>';
    $('signInBtn').onclick = signIn;
    if (why) msg(why);
  }

  // ---------- sample numbers for ?demo=1 (to preview the look before the setup is done)
  function demo() {
    $('demoTag').hidden = false;
    const sum = [['Recruitment summary · as of 27-11-2026 (this month = Nov 2026) · iCar Asia Malaysia'], ['Updated 27-11-2026 7:00 AM · from the iCar MY Recruitment Tracker'], [], ['Measure', 'Number'],
      ['Open positions', 12], ['On hold', 2], ['Filled this month', 3], ['Active candidates', 38], ['   Sourced', 9], ['   HM Review', 7], ['   Screening', 6],
      ['   1st Interview', 8], ['   2nd Interview', 4], ['   Reference Check', 2], ['   Offer', 2], ['Interviews this month', 21], ['Hired this month (by hire date)', 4],
      ['Joining this month (by join date)', 3], ['Upcoming joiners (join date after today)', 5]];
    const oc = [['Positions Opened & Closed · 2026 · all companies and divisions'], ['Updated'], [], ['Month', 'Position Opened', 'New Position', 'Filled', 'On Hold', 'Total Closed', 'Month Balance']];
    const nums = [[9, 4, 2, 0], [10, 3, 3, 1], [11, 4, 2, 0], [13, 4, 3, 1], [12, 2, 4, 0], [11, 3, 2, 1], [12, 3, 3, 0], [13, 4, 2, 0], [14, 3, 4, 1], [13, 4, 3, 0], [14, 4, 3, 0]];
    let bal = 5;
    nums.forEach(function (n, i) {
      const opened = bal + n[1], closed = n[2] + n[3];
      oc.push([['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov'][i] + ' 2026', opened, n[1], n[2], n[3], closed, opened - closed]);
      bal = opened - closed;
    });
    render(parse(sum, oc));
  }

  $('signOutBtn').onclick = signOut;
  $('refreshBtn').onclick = function () { loadData(); };
  if (DEMO) { demo(); return; }
  $('signInBtn').onclick = signIn;
  if (setupNeeded()) msg('This page is not set up yet: the sign-in key and the sheet ID still need to be filled in (see SETUP.md). Add <b>?demo=1</b> to the link to preview it with sample numbers.', 'info');
  initAuth();
  // still signed in from earlier in this tab: load straight away
  try {
    const saved = JSON.parse(sessionStorage.getItem('rdTok') || 'null');
    if (saved && saved.until > Date.now()) { token = saved.t; loadData(); }
  } catch (e) { /* ignore */ }
})();
</script>
</body>
</html>
